# TakeJournal's outside uptime check: the app and the site,
# every five minutes from GitHub Actions. A site down opens an issue here, assigned to the owner, so GitHub notifies
# him; it closes when the site is up again.
owner: jirisedlak
repo: status

sites:
  # the address the app's sign-in page calls on every visit; it answers 200 with the sign-in's settings
  - name: TakeJournal app
    url: https://app.takejournal.com/api/auth/status
  - name: TakeJournal site
    url: https://takejournal.com/

assignees:
  - jirisedlak

# keep every outage in the history, also those shorter than 15 minutes
skipDeleteIssues: true

status-website:
  baseUrl: /status
  name: TakeJournal status
  introTitle: "**TakeJournal** status"
  introMessage: The TakeJournal app and its web site, checked every five minutes from outside.
  navbar:
    - title: Status
      href: /
