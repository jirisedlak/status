# TakeJournal's outside uptime check: the app and the site, every five minutes from GitHub Actions. The owner's NAS
# starts each run (repository_dispatch "uptime", takejournal#957: GitHub's own five-minute schedule ran only every few
# hours); the schedule stays as the fallback. A site down opens an issue here, assigned to the owner, whom GitHub
# notifies; it closes when the site is up again.
owner: jirisedlak
repo: status

sites:
  # the address the app's sign-in page calls on every visit; it answers 200 with the sign-in's settings
  - name: TakeJournal app
    url: https://app.takejournal.com/api/auth/status
  - name: TakeJournal site
    url: https://takejournal.com/

assignees:
  - jirisedlak

# keep every outage in the history, also those shorter than 15 minutes
skipDeleteIssues: true

# the public page (#101): status.takejournal.com, a CNAME to jirisedlak.github.io set by the owner on 2026-10-19
status-website:
  cname: status.takejournal.com
  name: TakeJournal status
  logoUrl: https://app.takejournal.com/icon-192.png
  favicon: https://app.takejournal.com/icon-192.png
  introTitle: "**TakeJournal** status"
  introMessage: The TakeJournal app and its web site, checked every five minutes from outside.
  navbar:
    - title: Status
      href: /
    - title: TakeJournal
      href: https://takejournal.com/
